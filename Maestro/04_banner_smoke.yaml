# ============================================================
# Flow 4: Banner smoke — campaign appears on launch
# Screen:   Home Screen Kotlin
#
# WHAT THIS PROVES: banner renders at all on a fresh launch
# RUN THIS FIRST — if it fails, flows 01/02/03 are all moot
# ============================================================
appId: com.example.carousal
---
- launchApp:
    clearState: false

- waitForAnimationToEnd

# Banner must be visible on HomeScreen (no event required — display_trigger: true, trigger_event: "")
- assertVisible:
    text: "Close"

- takeScreenshot: "04_banner_smoke_PASS"
