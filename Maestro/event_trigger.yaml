# ============================================================
# Event-based trigger — campaign appears only after event fires
# Campaign: set a campaign to "Event-Based" trigger in dashboard
# Screen:   Home Screen Kotlin
#
# FIX: Updated to use actual event buttons from the example app
# (Login Event, Added to cart Event, Purchased Event, etc.)
# Replace EVENT_BUTTON below with whichever event your campaign listens to.
# ============================================================
appId: com.example.carousal
---
- launchApp:
      clearState: true

- waitForAnimationToEnd

# Step 1: Campaign must NOT appear before the event fires
- assertNotVisible:
      text: "Close"
      optional: true

- takeScreenshot: "event_trigger_before_event"

# Step 2: Fire the trigger event
# Tap whichever event button matches your campaign's trigger_event value:
#   "Login Event"           → fires login event
#   "Added to cart Event"   → fires add-to-cart event
#   "Purchased Event"       → fires purchase event
#   "Logout Event"          → fires logout event
#   "AppStorys Success Event" → fires appstorys_success event
- tapOn:
      text: "Login Event"      # <-- change to match your campaign's trigger_event

- waitForAnimationToEnd

# Step 3: Campaign MUST now be visible
- assertVisible:
      text: "Close"

- takeScreenshot: "event_trigger_PASS"